appId: ai.sigma.desktop
productName: SIGMA
copyright: Copyright © SIGMA contributors
asar: true
npmRebuild: false
directories:
  output: release
files:
  - desktop/*.cjs
  - desktop/loading.html
  - desktop/icon.png
  - package.json
  - LICENSE
  - "!node_modules/**/*"
extraResources:
  - from: build/kraken
    to: kraken
  - from: build/backend/sigma-backend
    to: backend
  - from: build/redis/redis-server
    to: redis/redis-server
  - from: build/redis/COPYING
    to: redis/COPYING
  - from: build/browsers
    to: browsers
linux:
  executableName: sigma
  category: Finance
  icon: desktop/icon.png
  target:
    - deb
    - AppImage
  artifactName: SIGMA-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: SIGMA
      Comment: SIGMA paper trading and strategy command center
      StartupWMClass: SIGMA
      Keywords: Trading;Strategy;Paper;Research;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2
    - libnspr4
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libxkbcommon0
    - libpango-1.0-0
    - libcairo2
    - libatk1.0-0
    - libatk-bridge2.0-0
